[project]
name = "alphax_piecework"
authors = [
    { name = "Neotec Integrated Solutions", email = "info@neotec.sa" }
]
description = "Enterprise piece-rate wages, shop-floor QC, anti-fraud validation and IoT edge capture for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
